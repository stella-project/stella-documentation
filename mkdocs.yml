site_name: STELLA
site_url: https://example.com/

theme:
  name: material
  logo: img/stella-logo.png
  favicon: img/favicon.ico
  icon:
    repo: fontawesome/brands/github
  features:
  - header.autohide
  - content.code.copy

  palette:
    primary: custom

extra_css:
- stylesheets/extra.css

markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences # https://squidfunk.github.io/mkdocs-material/reference/code-blocks/  
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.superfences

plugins:
- search
- mkdocstrings:
    handlers:
      python:
        setup_commands:
          - "import sys; sys.path.insert(0, 'app')"
          - "import sys; sys.path.insert(0, 'server')"

nav:
- Home: index.md

- About: about.md

- Researcher:
  - "Introduction": researcher/introduction.md
  - "Tutorial: Ranker": researcher/participants-ranking.md
  - "Tutorial: Recommender": researcher/participants-recommender-publications.md

- "Site Owner":
  - "Introduction": site-owner/introduction.md
  - "STELLA App" :
    - "About": site-owner/app.md
    - "Configuring Docker Compose": site-owner/app-docker-setup.md
    - "Environment Variables" : site-owner/app-env.md
    - "Initialising the Database": site-owner/app-init-db.md
    - "Endpoints and API Usage": site-owner/app-api.md
    - "REST API Documentation": site-owner/app-rest.md
    - "Database Schema": site-owner/app-database-schema.md
  - "STELLA Server":
    - "About": site-owner/server.md
    - "Configuring Docker Compose": site-owner/server-docker-setup.md
    - "Environment Variables": site-owner/server-env.md
    - "Initialising the Database": site-owner/server-init-db.md
    - "Endpoints and API Usage": site-owner/server-api.md
    - "REST API Documentation": site-owner/server-rest.md
    - "Database Schema": site-owner/server-database-schema.md
  - "Micro-service": site-owner/micro-service.md


- Developer:
  - "Introduction": developer/introduction.md
  - "Setup for Local Developement": developer/initial_setup.md
  - "Common Issues": developer/common_issues.md

- Resources: resources/resources.md

repo_url: https://github.com/stella-project
repo_name: stella-project
edit_uri: https://github.com/stella-project/stella-documentation/tree/master/docs
